 spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:investment
spring.datasource.username=sa
spring.datasource.password=

# Generate the schema from the JPA entities on startup, drop it on shutdown
spring.jpa.hibernate.ddl-auto=create-drop

# Run insert.sql after Hibernate has created the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:insert.sql

# Log the insert.sql script and each statement it executes
logging.level.org.springframework.jdbc.datasource.init.ScriptUtils=DEBUG

# Log the schema (create sequence / create table / alter table) generated by Hibernate, and other SQL
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
